name: CI — Soft-DTW CFE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run smoke test (GunPoint, 3 samples, no Optuna)
      run: |
        python -m soft_dtw_cfe.run_experiments \
          --datasets GunPoint \
          --n_test 3 \
          --skip_optuna \
          --no_glacier

    - name: Upload figures as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: figures-${{ matrix.python-version }}
        path: soft_dtw_cfe/visualization/figures/
        retention-days: 7
